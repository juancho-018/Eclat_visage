<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclat Visage - Más Vendidos</title>
    <link rel="stylesheet" href="estilos.css">
    <!-- Fuentes de la marca -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #fbf9f6;
            color: #4a4238;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* TITULO DE LA SECCIÓN */
        .seccion-titulo {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        .seccion-titulo h2 {
            font-size: 32px;
            color: #3d352a;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .seccion-titulo p {
            font-size: 14px;
            color: #6e6456;
        }

        /* CONTENEDOR DE PRODUCTOS */
        .tienda-contenedor {
            width: 85%;
            margin: 0 auto 50px auto;
            text-align: center;
        }

        /* TARJETA DE PRODUCTO */
        .producto-tarjeta {
            background-color: #ffffff;
            border: 1px solid #f2ede7;
            width: 28%;
            margin: 2%;
            display: inline-block;
            vertical-align: top;
            box-sizing: border-box;
            padding: 15px;
            text-align: center;
            position: relative;
        }

        /* ETIQUETA DE BEST SELLER */
        .etiqueta-top {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #bc9c82;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .img-recuadro-producto {
            background-color: #fcfbfa;
            width: 100%;
            height: 220px;
            margin-bottom: 15px;
        }

        .img-recuadro-producto img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .producto-tarjeta h3 {
            font-size: 16px;
            color: #3d352a;
            margin: 10px 0 5px 0;
        }

        .producto-categoria {
            font-size: 11px;
            color: #bc9c82;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .producto-precio {
            font-size: 15px;
            color: #4a4238;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* BOTÓN DE COMPRA */
        .btn-anadir {
            display: block;
            width: 100%;
            background-color: #3d352a;
            color: #fbf9f6;
            padding: 10px;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
            border: none;
            cursor : pointer !important;
        }

        .btn-anadir:hover {
            background-color: #bc9c82;
        }
    </style>
</head>
<body>

    <!-- MÓDULO NAV CENTRALIZADO -->
    <div id="navbar-modulo"></div>
    <script src="modulos/nav.js"></script>


    <!-- ENCABEZADO -->
    <div class="seccion-titulo">
        <h2>Los Más Vendidos</h2>
        <p>Los menús favoritos de nuestra comunidad para transformar el rostro.</p>
    </div>

    <!-- GRILLA DE PRODUCTOS -->
    <div class="tienda-contenedor">
        
        <!-- Producto 1 -->
        <div class="producto-tarjeta">
            <span class="etiqueta-top">Top 1</span>
            <div class="img-recuadro-producto">
                <img src=".img/serum-vitc.jpg" alt="Sérum Iluminador">
            </div>
            <span class="producto-categoria">Nutrición Activa</span>
            <h3>Elíxir Iluminador Vitamina C</h3>
            <div class="producto-precio">$24.000</div>
            <!-- Cambiado texto y agregado onclick -->
            <button class="btn-anadir" onclick="agregarAlCarrito('Elíxir Iluminador Vitamina C')">Añadir al Carrito</button>
        </div>

        <!-- Producto 2 -->
        <div class="producto-tarjeta">
            <span class="etiqueta-top">Top 2</span>
            <div class="img-recuadro-producto">
                <img src=".img/crema-brillo.jpg" alt="Crema Hidratante">
            </div>
            <span class="producto-categoria">Hidratación</span>
            <h3>Crema Nutritiva de Día</h3>
            <div class="producto-precio">$26.000</div>
            <!-- Cambiado texto y agregado onclick -->
            <button class="btn-anadir" onclick="agregarAlCarrito('Crema Nutritiva de Día')">Añadir al Carrito</button>
        </div>

        <!-- Producto 3 -->
        <div class="producto-tarjeta">
            <span class="etiqueta-top">Top 3</span>
            <div class="img-recuadro-producto">
                <img src=".img/limpiador-facial.jpg" alt="Espuma Limpiadora">
            </div>
            <span class="producto-categoria">Limpieza</span>
            <h3>Espuma Limpiadora Suave</h3>
            <div class="producto-precio">$19.500</div>
            <!-- Cambiado texto y agregado onclick -->
            <button class="btn-anadir" onclick="agregarAlCarrito('Espuma Limpiadora Suave')">Añadir al Carrito</button>
        </div>

    </div>

    <!-- SCRIPT DEL CARRITO ÉCLAT VISAGE -->
    <script src="carrito.js"></script>
    <!-- FOOTER CENTRALIZADO -->
    <div id="footer-modulo"></div>
    <script src="modulos/footer.js"></script>
</body>
</html>
