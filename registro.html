<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Éclat Visage</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #eedfd2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .registro-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px 35px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            border: 1px solid #f2ede7;
        }

        .registro-card .logo {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #2c2a29;
        }

        .registro-card .logo span {
            font-size: 14px;
            color: #bc9c82;
            vertical-align: super;
        }

        .registro-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 500;
            color: #2c2a29;
            margin-bottom: 6px;
        }

        .subtitulo-registro {
            font-size: 12px;
            color: #777;
            margin-bottom: 25px;
        }

        .campo {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #4a4a4a;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e3d4c7;
            border-radius: 4px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            color: #2c2a29;
            background-color: #fcfbfa;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #bc9c82;
            background-color: #ffffff;
            box-shadow: 0 0 5px rgba(188, 156, 130, 0.3);
        }

        .btn-registro {
            width: 100%;
            background-color: #bc9c82;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        .btn-registro:hover {
            background-color: #a4856d;
        }
    </style>
</head>
<body>

    <div class="registro-card">
        <div class="logo">eclat visage<span>✦</span></div>
        <h2>Bienvenida / Bienvenido</h2>
        <p class="subtitulo-registro">Por favor regístrate para ingresar a nuestra tienda</p>

        <form action="registro.php" method="POST">
            <div class="campo">
                <label>Nombre Completo:</label>
                <input type="text" name="nombre" placeholder="Tu nombre completo" required>
            </div>

            <div class="campo">
                <label>Correo Electrónico:</label>
                <input type="email" name="correo" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="campo">
                <label>Teléfono:</label>
                <input type="text" name="telefono" placeholder="Ej: 3001234567" required>
            </div>

            <div class="campo">
                <label>Dirección:</label>
                <input type="text" name="direccion" placeholder="Ej: Calle 10 # 15-20" required>
            </div>

            <button type="submit" class="btn-registro">REGISTRARSE E INGRESAR</button>
        </form>
    </div>

</body>
</html>
